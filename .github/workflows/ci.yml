name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      # Offline: no key means FakeModel; the eval replays recorded answers.
      META_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: ffmpeg (voice-note conversion tests)
        # apt mirrors sometimes hang on a runner: bound each try and retry.
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do
            timeout 180 sudo apt-get update -q \
              && timeout 300 sudo apt-get install -y -q --no-install-recommends ffmpeg \
              && exit 0
            echo "apt try $i failed or hung; retrying"; sleep 10
          done
          exit 1
      # The langfuse extra is installed so the tracing tests run against the
      # real SDK; with no LANGFUSE_* keys (and CI set) tracing is a no-op.
      - run: python -m pip install -e '.[dev,otel,langfuse]'
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Tests (tracing tests use a mock client and a socket guard)
        run: python -m pytest
      - name: No Langfuse key or trace leaves CI
        run: |
          test -z "${LANGFUSE_SECRET_KEY:-}" && test -z "${LANGFUSE_PUBLIC_KEY:-}"
          python -c "from mimi.observe.langfuse_export import exporter_from_env as e; import sys; sys.exit(0 if not e().enabled else 1)"
      - name: World fixture matches its seed
        run: python -m mimi.world --check
      - name: Reply-reader eval (recorded Muse Spark answers)
        run: python -m mimi.receipts.eval
      - name: Voice-note eval, 50 clips with and without hints (recorded Spitch, Muse Voice Transcribe and Muse Spark answers)
        run: python -m mimi.voice.eval
      - name: Payment-screenshot eval, 40 synthetic alerts (recorded Muse Spark answers; fails on a fake marked likely)
        run: python -m mimi.proof.eval
      - name: Stock backtest, estimator v0.2 with one-tap counts (no model; caps and drafts gated)
        run: python -m mimi.stock.backtest --strict
      - name: Stock answer eval, 30 synthetic answers (recorded Muse Spark answers; fails under 95%)
        run: python -m mimi.stock.eval
      - name: Offline low-stock scene
        run: python -m mimi.sim --stock --transcript
      - name: Harness evals (50 Collector scenarios scripted and recorded Muse Spark, 41 security cases, 200 replayed retries, runaway budgets, idle cost; fails on any pass mark)
        run: python -m mimi.harness.eval --no-write
      - name: Router eval, 300 labelled messages in five languages (rules, phrases, fast classifier, recorded Muse Spark answers; fails on accuracy < 95%, any money misroute, clarify > 8%, a rule case calling the model, p95 >= 800 ms)
        run: python -m mimi.harness.router_eval --no-write
      - name: Context builder eval (50 Collector scenarios vs a full-history baseline on recorded Muse Spark answers, two-distributor leakage, prefix stability, pointers, cache hits; fails on any pass mark)
        run: python -m mimi.harness.context_eval --no-write
      - name: Credit eval, 24 synthetic shelf photos + 6 stress, 10 conversations, routing (recorded SAM 3.1 and Muse Spark answers; fails on any pass mark, an auto-approval, a money move or an invented number)
        run: python -m mimi.credit.eval --no-write
      - name: Offline credit-bump scene
        run: python -m mimi.sim --credit --transcript
      - name: Offline 3-shop sim
        run: python -m mimi.sim --shops 3 --transcript
      - name: Offline 3-shop sim with voice notes
        run: python -m mimi.sim --shops 3 --transcript --voice 1
      - name: Offline 3-shop sim with voice notes, payment promises and voice replies
        env:
          SPITCH_API_KEY: ""
        run: python -m mimi.sim --shops 3 --transcript --voice 1 --promises 1 --voice-replies
      - name: Offline 3-shop sim with payment screenshots (genuine, fake and a resend)
        run: python -m mimi.sim --shop-ids shop-019,shop-037,shop-025 --transcript --screenshots 1 --fakes 0.4
      - name: End-to-end eval, 10 simulated shops through the HTTP API, the durable store and real worker processes with a SIGKILL mid-turn (recorded Muse Spark, SAM 3.1 and persona answers; fails on scene success < 90%, routing < 95%, any safety violation, money move, invented figure, duplicate reply or cross-tenant read)
        run: python -m mimi.api.e2e --no-write
      - name: OpenAPI document matches the API (docs/api/openapi.json)
        run: python -m mimi.api openapi --check
      - name: Migrations run on a clean SQLite database
        env:
          MIMI_DB_URL: sqlite:///${{ runner.temp }}/mimi-ci.db
        run: alembic upgrade head && alembic downgrade base

  postgres:
    name: store, API and worker-kill tests on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # A throwaway database inside this job only; not a secret.
          POSTGRES_PASSWORD: mimi-ci  # pragma: allowlist secret
          POSTGRES_DB: mimi
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      META_API_KEY: ""
      MIMI_TEST_DATABASE_URL: postgresql://postgres:mimi-ci@localhost:5432/mimi  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev,postgres]'
      - name: Migrations up and down on Postgres
        env:
          MIMI_DB_URL: postgresql://postgres:mimi-ci@localhost:5432/mimi  # pragma: allowlist secret
        run: alembic upgrade head && alembic downgrade base
      - name: Store, API and worker-kill tests on Postgres
        run: python -m pytest tests/test_store.py tests/test_api.py tests/test_worker_kill.py

  docker:
    name: docker image starts and answers
    runs-on: ubuntu-latest
    env:
      # Throwaway keys for a container that lives for this job only.
      CI_API_KEYS: coral-lane:owner:ci-owner-key-000001,coral-lane:channel:ci-channel-key-0001  # pragma: allowlist secret
      CI_CHANNEL_KEY: ci-channel-key-0001  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mimi-agent:ci .
      - name: Container migrates, seeds the synthetic world and answers a turn (offline model)
        run: |
          docker run -d --name mimi -p 8000:8000 \
            -e MIMI_API_KEYS="$CI_API_KEYS" \
            mimi-agent:ci
          for i in $(seq 1 60); do curl -sf localhost:8000/v1/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/v1/turns \
            -H "Authorization: Bearer $CI_CHANNEL_KEY" -H 'Content-Type: application/json' \
            -d '{"message_id":"ci.1","phone":"+2340000000100","text":"hi"}' | tee /tmp/turn.json
          grep -q '"state":"done"' /tmp/turn.json
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/v1/shops)" = 401
      - if: always()
        run: docker logs mimi 2>&1 | tail -40 || true

  secrets:
    name: secret scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install detect-secrets==1.5.0
      - name: detect-secrets (no finding outside the baseline)
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: gitleaks (whole history)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  provenance:
    name: hackathon provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/hackathon_provenance.py
